<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Django DevBar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; background: #f5f5f5; padding: 8px; display: flex; flex-direction: column; overflow: hidden; }
    #app { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; overscroll-behavior: contain; }

    .empty-state { text-align: center; padding: 32px 16px; color: #666; }
    .empty-state h2 { font-size: 13px; margin-bottom: 6px; }
    .empty-state p { font-size: 11px; color: #999; }
    .code { font-family: monospace; background: #eee; padding: 1px 4px; border-radius: 2px; }

    .current { background: #fff; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 3; }
    .req-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .request-url, .hist-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .request-url { color: #1a73e8; font-weight: 500; }
    .request-method, .request-type { flex-shrink: 0; }
    .request-method { padding: 1px 4px; border-radius: 2px; background: #e8f0fe; color: #1a73e8; font-weight: 600; font-size: 10px; }
    .request-type { padding: 1px 3px; border-radius: 2px; font-weight: 600; font-size: 9px; }
    .type-page { background: #cce5ff; color: #004085; }
    .type-doc { background: #d4edda; color: #155724; }
    .type-xhr { background: #e2e3e5; color: #6c757d; }

    .current-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .metrics { display: flex; gap: 12px; flex-shrink: 0; align-items: center; }
    .metric { display: inline-flex; align-items: baseline; gap: 3px; }
    .metric-label { color: #888; font-size: 10px; }
    .metric-unit { color: #999; font-size: 10px; }
    .dup-warn { color: #dc2626; font-weight: 500; }
    .sim-warn { color: #ea580c; font-weight: 500; }
    .trunc-note { margin-top: 8px; font-size: 10px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; padding: 6px 8px; line-height: 1.4; }

    .panel-actions { display: flex; align-items: center; gap: 6px; }
    .copy-button { appearance: none; border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 4px; padding: 3px 7px; width: 96px; text-align: center; font: inherit; font-size: 10px; line-height: 1.2; cursor: pointer; white-space: nowrap; }
    .copy-button:hover:not(:disabled) { border-color: #9ca3af; background: #f9fafb; }
    .copy-button:disabled { cursor: not-allowed; opacity: 0.45; }
    .copy-button.primary { border-color: #bfdbfe; background: #eff6ff; color: #1d4ed8; }
    .copy-button.is-copied { border-color: #86efac; background: #f0fdf4; color: #166534; }
    .copy-button.is-copy-failed { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }

    .queries { padding: 0 2px 8px 0; margin-bottom: 8px; }
    .query { margin-bottom: 3px; font-size: 10px; padding: 4px 6px; border-radius: 4px; background: rgba(255,255,255,0.72); position: relative; z-index: 1; }
    .query:last-child { margin-bottom: 0; }
    .query code { color: #333; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; overflow-wrap: anywhere; }
    .sql-keyword { color: #0ea5e9; font-weight: 500; }
    .query-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 2px; }
    .query-index { color: #6b7280; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .query-summary { flex: 1; min-width: 0; overflow: hidden; }
    .query-summary code { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
    .query-time { color: #0ea5e9; font-weight: 600; margin-left: 4px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .query.duplicate { background: #fef2f2; border-left: 3px solid #dc2626; }
    .query.similar { background: #fff7ed; border-left: 3px solid #ea580c; }
    .waterfall-container { margin-top: 8px; padding: 16px 0 0; position: relative; }
    .waterfall-row { display: flex; align-items: center; font-size: 9px; margin-top: 2px; padding: 2px 0; border-bottom: 1px solid #e5e7eb; }
    .waterfall-start { width: 48px; text-align: right; padding-right: 6px; color: #6b7280; font-size: 9px; flex-shrink: 0; }
    .waterfall-end { width: 48px; text-align: left; padding-left: 6px; color: #6b7280; font-size: 9px; flex-shrink: 0; }
    .waterfall-chart { flex: 1; height: 12px; position: relative; background: #f9fafb; border-radius: 2px; overflow: hidden; }
    .waterfall-grid-lines { position: absolute; top: 0; left: 54px; right: 54px; bottom: 0; pointer-events: none; z-index: 0; }
    .waterfall-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.08); }
    .waterfall-grid-label { position: absolute; top: 0; font-size: 8px; color: #999; transform: translateX(-50%); white-space: nowrap; }
    .timing-bar { height: 8px; position: absolute; top: 2px; border-radius: 2px; min-width: 2px; z-index: 1; }
    .timing-bar.fast { background: #22c55e; }
    .timing-bar.medium { background: #eab308; }
    .timing-bar.slow { background: #ef4444; }

    .history { margin-top: 8px; }
    .history-title { font-weight: 500; margin-bottom: 6px; color: #666; font-size: 10px; text-transform: uppercase; background: #f5f5f5; padding: 2px 0; }
    .hist-row { background: #fff; border-radius: 3px; padding: 5px 8px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
    .hist-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .hist-url { color: #1a73e8; }
    .hist-stats { display: flex; gap: 12px; color: #666; font-size: 10px; flex-shrink: 0; }
    .url-link { color: #666; text-decoration: none; margin-left: 4px; font-size: 11px; opacity: 0.7; transition: opacity 0.15s ease; }
    .url-link:hover { opacity: 1; }

    .controls { display: flex; align-items: center; justify-content: flex-end; padding: 4px 8px; margin-bottom: 4px; gap: 12px; flex-shrink: 0; }
    .controls label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666; cursor: pointer; user-select: none; }
    .controls input[type="checkbox"] { cursor: pointer; }
    .repo-link { font-size: 10px; color: #1a73e8; text-decoration: none; }
    .repo-link:hover { text-decoration: underline; }

    @media (max-width: 720px) {
      .current { align-items: stretch; flex-direction: column; gap: 8px; }
      .current-right { align-items: flex-start; flex-direction: column; gap: 6px; }
      .metrics, .hist-stats { flex-wrap: wrap; row-gap: 4px; }
      .hist-row { align-items: flex-start; flex-direction: column; gap: 4px; }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #e0e0e0; }
      .empty-state { color: #999; }
      .empty-state p { color: #666; }
      .empty-state a { color: #6db3f2; }
      .code { background: #333; color: #e0e0e0; }
      .current, .hist-row { background: #2d2d2d; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
      .request-url, .hist-url { color: #6db3f2; }
      .request-method { background: #1a3a5c; color: #6db3f2; }
      .metric-label { color: #888; }
      .hist-stats { color: #999; }

      .copy-button { background: #2d2d2d; border-color: #4b5563; color: #d1d5db; }
      .copy-button:hover:not(:disabled) { background: #374151; border-color: #6b7280; }
      .copy-button.primary { background: #172554; border-color: #1d4ed8; color: #bfdbfe; }
      .copy-button.is-copied { background: #14532d; border-color: #22c55e; color: #bbf7d0; }
      .copy-button.is-copy-failed { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }
      .query { background: rgba(45, 45, 45, 0.72); }
      .query code { color: #e0e0e0; }
      .sql-keyword { color: #38bdf8; }
      .query-index { color: #9ca3af; }
      .query.duplicate { background: rgba(220, 38, 38, 0.2); }
      .query.similar { background: rgba(234, 88, 12, 0.2); }
      .dup-warn { color: #f87171; }
      .sim-warn { color: #fb923c; }
      .trunc-note { color: #fbbf24; background: rgba(251, 191, 36, 0.08); border-color: rgba(251, 191, 36, 0.35); }
      .waterfall-row { border-bottom-color: #374151; }
      .waterfall-start, .waterfall-end { color: #9ca3af; }
      .waterfall-chart { background: #1f2937; }
      .waterfall-grid-line { background: rgba(255,255,255,0.1); }
      .waterfall-grid-label { color: #666; }
      .timing-bar.fast { background: #16a34a; }
      .timing-bar.medium { background: #ca8a04; }
      .timing-bar.slow { background: #dc2626; }
      .type-page { background: #1e3a5f; color: #93c5fd; }
      .type-doc { background: #1e3a2f; color: #6ee7b7; }
      .type-xhr { background: #374151; color: #9ca3af; }
      .history-title { color: #888; background: #1e1e1e; }
      .controls label { color: #999; }
      .repo-link { color: #6db3f2; }
      .url-link { color: #999; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>
      <input type="checkbox" id="show-bar-toggle" checked>
      Show <a href="https://github.com/amureki/django-devbar" target="_blank" class="repo-link">django-devbar</a> on page
    </label>
  </div>
  <div id="app"></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
